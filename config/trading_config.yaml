mode: shadow
trading_enabled: false
live_auto_enabled: false

kalshi:
  env: production
  demo_base_url: https://external-api.demo.kalshi.co/trade-api/v2
  production_base_url: https://external-api.kalshi.com/trade-api/v2
  request_timeout_seconds: 15
  max_retries: 2
  retry_backoff_seconds: 0.5
  allow_public_market_data_without_auth: true

markets:
  default_location: NYC
  supported_locations:
    - NYC
  target_market_type: daily_high_temperature
  supported_market_types:
    - daily_high_temperature
  status: open
  tradable_statuses:
    - open
    - active
  min_minutes_to_close: 30
  page_limit: 1000
  max_pages: 5
  # Kalshi's market-data quick start documents KXHIGHNY as the NYC daily-high
  # temperature series.
  series_tickers:
    NYC:
      - KXHIGHNY
  location_terms:
    NYC:
      - NYC
      - New York
      - New York City
      - Central Park
  weather_terms:
    - temperature
    - high temperature
    - high temp
    - daily high
    - weather

weather:
  provider: nws
  observations_provider: nws_station
  forecast_base_url: https://api.open-meteo.com/v1/forecast
  timezone: America/New_York
  temperature_unit: fahrenheit
  wind_speed_unit: mph
  precipitation_unit: inch
  # NWS Central Park observations align with Kalshi's settlement station.
  nws_station:
    station_id: KNYC
    station_name: NY City Central Park
    ghcn_station_id: GHCND:USW00094728
    latitude: 40.77898
    longitude: -73.96925
    base_url: https://api.weather.gov
    user_agent: KalshiWeatherTrading/0.1 (local research; contact user)
  # Open-Meteo remains available for observation fallback; NWS gridpoint is used
  # for live forecasts.
  observation_grid:
    latitude: 40.808434
    longitude: -74.0199
  forecast_grid:
    latitude: 40.78858
    longitude: -73.9661
  observed_past_hours: 12
  forecast_past_hours: 12
  forecast_days: 2
  max_observation_age_minutes: 90
  max_forecast_age_minutes: 180
  # NWS station observations expose the true intra-hour high via periodic max-temp
  # remarks. After this window, observed_high_so_far is treated as a lower bound
  # and the dashboard marks weather NO_TRADE.
  max_unverified_observed_high_minutes: 20
  require_forecast_issue_time: false

settlement:
  # Model probabilities are allowed before the normal NYC daily-high window.
  typical_peak_hour: 15
  # After this local hour, a falling temperature path can force diagnostic-only
  # POST_PEAK_NO_TRADE unless final settlement data is available.
  peak_window_end_hour: 18
  verified_settlement_min_hour: 18
  post_peak_temp_drop_f: 2.0
  min_minutes_since_high: 60
  forecast_remaining_margin_f: 0.5
  settlement_tail_probability: 0.01
  block_unverified_observed_high: true

risk:
  kill_switch_path: runtime/KILL_SWITCH_TRADING
  max_contracts_per_order: 1
  max_contracts_per_market: 5
  max_dollars_per_order: 5
  max_dollars_per_market: 20
  max_dollars_per_event: 30
  max_correlated_event_exposure_dollars: 30
  max_total_exposure: 50
  max_open_orders: 10
  max_daily_loss_dollars: 25
  min_cash_reserve_dollars: 0
  denylist_tickers: []
  denylist_event_tickers: []
  denylist_target_dates: []

paper:
  starting_cash_dollars: 100
  fill_mode: immediate

edge:
  min_edge_dollars: 0.02
  min_edge_percent: 0.0
  slippage_buffer_dollars: 0.005
  min_liquidity_contracts: 1.0
  max_spread_dollars: 0.25
  max_staleness_seconds: 300
  fee_rate: 0.07
  evaluation_contracts: 1.0
  trade_fee_rounding_increment: 0.0001
  balance_rounding_increment: 0.01

outputs:
  live_trading_dir: outputs/live_trading
  market_discovery_snapshot_path: outputs/live_trading/market_discovery_snapshot.csv
  market_discovery_raw_path: outputs/live_trading/market_discovery_raw.json
  contract_bucket_mapping_path: outputs/live_trading/contract_bucket_mapping.csv
  live_weather_snapshot_path: outputs/live_trading/live_weather_snapshot.csv
  live_feature_rows_path: outputs/live_trading/live_feature_rows.csv
  live_feature_freshness_path: outputs/live_trading/live_feature_freshness.csv
  live_bucket_probabilities_path: outputs/live_trading/live_bucket_probabilities.csv
  settlement_state_path: outputs/live_trading/settlement_state.csv
  orderbook_snapshot_path: outputs/live_trading/orderbook_snapshot.csv
  orderbook_summary_path: outputs/live_trading/orderbook_summary.csv
  edge_table_path: outputs/live_trading/edge_table.csv
  portfolio_snapshot_path: outputs/live_trading/portfolio_snapshot.csv
  risk_decisions_path: outputs/live_trading/risk_decisions.csv
  order_intents_path: outputs/live_trading/order_intents.csv
  paper_orders_path: outputs/live_trading/paper_orders.csv
  paper_positions_path: outputs/live_trading/paper_positions.csv
  paper_pnl_path: outputs/live_trading/paper_pnl.csv
  trading_cycle_log_path: outputs/live_trading/trading_cycle_log.csv
  dashboard_status_path: outputs/live_trading/dashboard_status.json
