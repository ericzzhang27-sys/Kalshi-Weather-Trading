name: Aggregate Kalshi NYC hourly candles

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/collect_kalshi_nyc_hourly_candles.py
      - .github/workflows/kalshi-nyc-candles.yml
  push:
    branches:
      - data/kalshi-nyc-candles
    paths:
      - scripts/collect_kalshi_nyc_hourly_candles.py
      - .github/workflows/kalshi-nyc-candles.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests==2.32.5

      - name: Collect public Kalshi hourly candlesticks
        env:
          KALSHI_WORKERS: "8"
        run: python scripts/collect_kalshi_nyc_hourly_candles.py

      - name: Package dataset
        run: |
          cd outputs
          zip -9 -r Kalshi_NYC_High_Hourly_Candles_2021_2026.zip kalshi_nyc_hourly

      - uses: actions/upload-artifact@v4
        with:
          name: Kalshi_NYC_High_Hourly_Candles_2021_2026
          retention-days: 14
          compression-level: 0
          path: outputs/Kalshi_NYC_High_Hourly_Candles_2021_2026.zip

      - name: Commit compact manifest and coverage report
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add outputs/kalshi_nyc_hourly/coverage_report.json outputs/kalshi_nyc_hourly/kalshi_nyc_high_markets.csv
          if git diff --cached --quiet; then
            echo "No manifest changes"
          else
            git commit -m "Record Kalshi NYC candle coverage [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
