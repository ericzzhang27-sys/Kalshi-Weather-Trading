name: Validate KNYC historical backfill PR

on:
  pull_request:
    paths:
      - scripts/backfill_knyc_iem.py
      - scripts/validate_knyc_settlement_sources.py
      - scripts/build_regional_asos_features.py
      - .github/workflows/backfill-knyc-data.yml
      - docs/data/settlement_aligned_history.md

permissions:
  contents: write

jobs:
  backfill:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install data dependencies
        run: pip install pandas==2.3.3 numpy==2.3.2 requests==2.32.5

      - name: Backfill KNYC 2018-present
        run: |
          python scripts/backfill_knyc_iem.py \
            --start-date 2018-01-01 \
            --end-date "$(date -u +%F)"

      - name: Validate CLI versus existing NCEI TMAX
        run: python scripts/validate_knyc_settlement_sources.py

      - name: Build regional ASOS hourly feature table
        run: |
          python -m scripts.build_regional_asos_features \
            --start-date 2018-01-01 \
            --end-date "$(date -u +%F)" \
            --max-age-minutes 90 \
            --output data/processed/regional_asos_hourly_features_2018_2026.csv \
            --raw-output outputs/data/regional_asos_observations_2018_2026.csv \
            --report-output outputs/data/regional_asos_feature_coverage.json

      - name: Validate regional timestamp safety and coverage
        run: |
          python - <<'PY'
          import json
          import pandas as pd

          path = "data/processed/regional_asos_hourly_features_2018_2026.csv"
          df = pd.read_csv(path)
          pt = pd.to_datetime(df["prediction_time_utc"], utc=True, errors="raise")
          assert pt.is_monotonic_increasing
          assert not pt.duplicated().any()
          for station in ["knyc", "klga", "kjfk", "kewr"]:
              ot = pd.to_datetime(df[f"{station}_observation_time_utc"], utc=True, errors="coerce")
              assert not (ot.notna() & (ot > pt)).any(), f"future {station} observation"
              age = pd.to_numeric(df[f"{station}_observation_age_min"], errors="coerce")
              assert not (age.dropna() < 0).any()
              assert not (age.dropna() > 90.0001).any()
          coverage = float((df["regional_station_count_available"] >= 3).mean())
          assert coverage > 0.95, coverage
          report = json.load(open("outputs/data/regional_asos_feature_coverage.json"))
          print(json.dumps(report, indent=2))
          print(f"validated regional rows={len(df):,} columns={len(df.columns):,}")
          PY

      - name: Upload historical data package
        uses: actions/upload-artifact@v4
        with:
          name: Kalshi_weather_data_2018_2026
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          path: |
            data/raw/NYC_nws_hourly_2018_2026.csv
            data/processed/knyc_cli_daily_2018_2026.csv
            data/processed/regional_asos_hourly_features_2018_2026.csv
            outputs/data/regional_asos_observations_2018_2026.csv
            outputs/data/regional_asos_feature_coverage.json
            outputs/data/knyc_backfill_coverage.json
            outputs/data/knyc_cli_vs_ncei_validation.json
            outputs/data/knyc_cli_vs_ncei_mismatches.csv
            config/source_parity.yaml
            docs/data/settlement_aligned_history.md

      - name: Commit generated outputs to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add data/raw/NYC_nws_hourly_2018_2026.csv \
                  data/processed/knyc_cli_daily_2018_2026.csv \
                  data/processed/regional_asos_hourly_features_2018_2026.csv \
                  outputs/data/regional_asos_feature_coverage.json \
                  outputs/data/knyc_backfill_coverage.json \
                  outputs/data/knyc_cli_vs_ncei_validation.json \
                  outputs/data/knyc_cli_vs_ncei_mismatches.csv
          if git diff --cached --quiet; then
            echo "No generated data changes"
          else
            git commit -m "Backfill KNYC and regional ASOS historical data [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
