# Free 24/7 orderbook collection via GitHub Actions.
#
# Runs the NYC daily-high orderbook scraper once per hour on GitHub's
# servers (no local PC required) and commits the new snapshots back to
# this repository so history accumulates for backtesting.
#
# Free-tier fit:
#   - Public repo: unlimited Actions minutes.
#   - Private repo: ~730 min/month used vs 2,000 free -> fits comfortably.
#
# Notes:
#   - GitHub cron can be delayed a few minutes at busy times; timestamps in
#     the data are the actual fetch times, so this only shifts the hour
#     slightly, never corrupts it.
#   - The scraper's cross-cycle timestamp-monotonicity check relies on the
#     committed state file (data/raw/kalshi_orderbooks/state/), which this
#     workflow commits back each run.

name: orderbook-scraper

on:
  schedule:
    - cron: "7 * * * *"   # hourly at :07 UTC (offset avoids top-of-hour congestion)
  workflow_dispatch: {}   # allow manual runs from the Actions tab

concurrency:
  group: orderbook-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Must cover every third-party import reachable from
        # scripts/run_orderbook_scraper.py: requests/yaml/pandas in the scraper,
        # matplotlib + numpy via src.distribution_pricing / src.predict_distribution,
        # scipy via src.distributional_model (all pulled in by src.trading's
        # package __init__), and cryptography for the Kalshi client's request
        # signing. Missing packages here crash the cycle at import time -
        # silently, if the failure-masking removed below were still in place.
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml pandas numpy scipy scikit-learn matplotlib cryptography

      - name: Record baseline scrape log size
        id: baseline
        run: echo "log_lines=$(wc -l < data/raw/kalshi_orderbooks/scrape_log.csv)" >> "$GITHUB_OUTPUT"

      - name: Run one scrape cycle
        id: scrape
        # A FAIL validation exits 1 but still quarantines the cycle on disk and
        # appends its scrape_log.csv row; we continue so that evidence is
        # committed, then fail the job below so the breakage is visible.
        continue-on-error: true
        run: python scripts/run_orderbook_scraper.py

      - name: Commit collected data
        if: always()
        run: |
          git config user.name "orderbook-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/kalshi_orderbooks
          if git diff --cached --quiet; then
            echo "No new data this cycle."
          else
            git commit -m "orderbook data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi

      - name: Verify cycle produced data
        # Every completed cycle (OK/WARN/FAIL) appends exactly one row to
        # scrape_log.csv. If the log did not grow, the scraper crashed before it
        # could log anything (e.g. missing dependency, network/auth setup
        # error) - fail loudly instead of leaving a green no-op run.
        if: always()
        run: |
          now=$(wc -l < data/raw/kalshi_orderbooks/scrape_log.csv)
          base=${{ steps.baseline.outputs.log_lines }}
          echo "scrape_log.csv lines: baseline=${base} now=${now}"
          if [ "$now" -le "$base" ]; then
            echo "::error::scrape_log.csv did not grow this cycle (baseline=${base}, now=${now}) - the scraper crashed before logging. Check the 'Run one scrape cycle' step output."
            exit 1
          fi
          if [ "${{ steps.scrape.outcome }}" != "success" ]; then
            echo "::error::cycle ended non-zero (quarantine + log row committed for inspection)."
            exit 1
          fi