# Free 24/7 orderbook collection via GitHub Actions.
#
# Runs the NYC daily-high orderbook scraper once per hour on GitHub's
# servers (no local PC required) and commits the new snapshots back to
# this repository so history accumulates for backtesting.
#
# Free-tier fit:
#   - Public repo: unlimited Actions minutes.
#   - Private repo: ~730 min/month used vs 2,000 free -> fits comfortably.
#
# Notes:
#   - GitHub cron can be delayed a few minutes at busy times; timestamps in
#     the data are the actual fetch times, so this only shifts the hour
#     slightly, never corrupts it.
#   - The scraper's cross-cycle timestamp-monotonicity check relies on the
#     committed state file (data/raw/kalshi_orderbooks/state/), which this
#     workflow commits back each run.

name: orderbook-scraper

on:
  schedule:
    - cron: "7 * * * *"   # hourly at :07 UTC (offset avoids top-of-hour congestion)
  workflow_dispatch: {}   # allow manual runs from the Actions tab

concurrency:
  group: orderbook-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml pandas

      - name: Run one scrape cycle
        # A FAIL validation exits 1 but still quarantines the cycle on disk;
        # we continue so the quarantine + log are committed for inspection.
        run: |
          python scripts/run_orderbook_scraper.py || \
            echo "::warning::cycle ended non-zero (check scrape_log.csv / quarantine/)"

      - name: Commit collected data
        run: |
          git config user.name "orderbook-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/kalshi_orderbooks
          if git diff --cached --quiet; then
            echo "No new data this cycle."
          else
            git commit -m "orderbook data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi