name: Backfill KNYC settlement-aligned data

on:
  pull_request:
    paths:
      - .github/workflows/backfill-knyc-data.yml
      - scripts/collect_kalshi_nyc_hourly_candles.py

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests==2.32.5

      - name: Collect public Kalshi NYC hourly candles
        env:
          KALSHI_WORKERS: '8'
        run: python scripts/collect_kalshi_nyc_hourly_candles.py

      - name: Package dataset
        run: |
          cd outputs
          zip -9 -r Kalshi_NYC_High_Hourly_Candles_2021_2026.zip kalshi_nyc_hourly

      - uses: actions/upload-artifact@v4
        with:
          name: Kalshi_NYC_High_Hourly_Candles_2021_2026
          retention-days: 14
          compression-level: 0
          path: outputs/Kalshi_NYC_High_Hourly_Candles_2021_2026.zip
